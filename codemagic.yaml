# App iOS do Clientaço: casca Capacitor que abre https://app.clientaco.com.br com o modo loja ligado
# (user agent "ClientacoApp" e window.Capacitor, ver src/lib/plataforma.js do Clientaço). O projeto Xcode é gerado no build.
# Assinatura: chave "Codemagic Baratice" (Developer Portal, time Thatai) e certificado "Baratice Apple Distribution".
# Nada secreto neste repositório.
definitions:
  preparar_ios: &preparar_ios
    name: Projeto iOS
    script: |
      set -e
      npm install --no-audit --no-fund
      npx cap add ios
      P=ios/App/App.xcodeproj/project.pbxproj
      sed -i "" 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' "$P"
      PL=ios/App/App/Info.plist
      B=/usr/libexec/PlistBuddy
      $B -c "Set :CFBundleDisplayName Clientaço" "$PL" || $B -c "Add :CFBundleDisplayName string Clientaço" "$PL"
      $B -c "Set :CFBundleShortVersionString 1.0.1" "$PL" || true
      $B -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PL" || true
      $B -c "Add :NSCameraUsageDescription string 'O Clientaço usa a câmera para ler o QR code de vouchers e para tirar fotos de atendimentos.'" "$PL" || true
      $B -c "Add :NSPhotoLibraryUsageDescription string 'O Clientaço acessa suas fotos quando você escolhe uma imagem para a ficha da cliente.'" "$PL" || true
      $B -c "Add :NSMicrophoneUsageDescription string 'O Clientaço usa o microfone quando você fala com a sua agenda pelo assistente de voz.'" "$PL" || true
      $B -c "Add :NSSpeechRecognitionUsageDescription string 'O Clientaço transforma sua fala em texto quando você fala com a sua agenda pelo assistente de voz.'" "$PL" || true
      $B -c "Add :NSContactsUsageDescription string 'O Clientaço acessa seus contatos apenas quando você escolhe importar clientes.'" "$PL" || true
      $B -c "Delete :UISupportedInterfaceOrientations~ipad" "$PL" || true
      sed -i "" 's/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = 1.0.1;/g' "$P"
      ICONE=ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
      curl -fsSL https://app.clientaco.com.br/icon-1024.png -o /tmp/icone.png
      sips -s format jpeg /tmp/icone.png --out /tmp/icone.jpg
      sips -s format png -z 1024 1024 /tmp/icone.jpg --out "$ICONE"
      sips -g pixelWidth -g pixelHeight -g hasAlpha "$ICONE"
      npx cap sync ios
workflows:
  preparar-perfil:
    name: Preparar perfil App Store
    max_build_duration: 15
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Baratice
    environment:
      vars:
        BUNDLE_ID: com.base6ae11cbaa5cc8360e26f0e7d.app
        CERT_VENCE: "2027-08"
    scripts:
      - name: Criar perfil App Store com o certificado do Codemagic
        script: |
          set -e
          app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json > /tmp/bid.json
          BID=$(python3 -c "import json;d=json.load(open('/tmp/bid.json'));print(d[0]['id'])")
          echo "Bundle ID resource: $BID"
          app-store-connect certificates list --type DISTRIBUTION --json > /tmp/certs.json
          python3 -c "import json;[print('CERT',c['id'],c['attributes'].get('displayName'),c['attributes'].get('expirationDate')) for c in json.load(open('/tmp/certs.json'))]"
          CID=$(python3 -c "import json,os;cs=[c for c in json.load(open('/tmp/certs.json')) if (c['attributes'].get('expirationDate') or '').startswith(os.environ['CERT_VENCE'])];print(cs[0]['id'])")
          echo "Certificado escolhido: $CID"
          app-store-connect bundle-ids profiles --bundle-ids "$BID" --json > /tmp/profs.json || echo "[]" > /tmp/profs.json
          python3 -c "import json;[print('PERFIL',p['id'],p['attributes'].get('name'),p['attributes'].get('profileType'),p['attributes'].get('profileState')) for p in json.load(open('/tmp/profs.json'))]"
          app-store-connect profiles create "$BID" --type IOS_APP_STORE --certificate-ids "$CID" --name "Clientaco App Store Codemagic $(date +%Y%m%d%H%M)" --json
  ios-testflight:
    name: Clientaço iOS para App Store Connect
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Baratice
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.base6ae11cbaa5cc8360e26f0e7d.app
      xcode: latest
      node: 22
      vars:
        APP_STORE_APPLE_ID: 6828994210
    scripts:
      - *preparar_ios
      - name: Perfis de assinatura
        script: xcode-project use-profiles
      - name: Numero do build
        script: |
          ULTIMO=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 1)
          PROXIMO=$(( ${ULTIMO:-1} + 1 ))
          echo "Build $PROXIMO"
          sed -i "" "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $PROXIMO;/g" ios/App/App.xcodeproj/project.pbxproj
      - name: Gerar IPA
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
  android-play:
    # Android do Clientaço (mesma casca do iOS). Assinado com a chave de envio "clientaco_upload",
    # cadastrada pelo Carlos em Codemagic > Code signing identities > Android keystores.
    # Só funciona no Play depois que o Google aprovar a troca da chave de envio.
    name: Clientaço Android (AAB para o Google Play)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - clientaco_upload
      node: 22
      java: 21
      vars:
        VERSAO_NOME: "1.0.1"
        VERSAO_CODIGO: "2"
    scripts:
      - name: Projeto Android
        script: |
          set -e
          npm install --no-audit --no-fund
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO "$M" || perl -0pi -e 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n    <application#' "$M"
          G=android/app/build.gradle
          sed -i "" "s/versionCode [0-9]*/versionCode $VERSAO_CODIGO/; s/versionName \"[^\"]*\"/versionName \"$VERSAO_NOME\"/" "$G"
          grep -E "applicationId|versionCode|versionName" "$G"
          for d in mipmap-mdpi:48 mipmap-hdpi:72 mipmap-xhdpi:96 mipmap-xxhdpi:144 mipmap-xxxhdpi:192; do
            P=${d%%:*}; S=${d##*:}
            curl -fsSL https://app.clientaco.com.br/icon-1024.png -o /tmp/ic.png
            sips -s format png -z $S $S /tmp/ic.png --out android/app/src/main/res/$P/ic_launcher.png >/dev/null
            cp android/app/src/main/res/$P/ic_launcher.png android/app/src/main/res/$P/ic_launcher_round.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          npx cap sync android
      - name: Gerar AAB assinado
        script: |
          set -e
          cd android
          cat >> app/build.gradle <<'G'
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
              buildTypes { release { signingConfig signingConfigs.release } }
          }
          G
          ./gradlew bundleRelease
      - name: Conferir AAB
        script: |
          set -e
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab)
          echo "Certificado que assinou o AAB (deve ser SHA1 16:1E:F4:94...):"
          keytool -printcert -jarfile "$AAB" | grep -E "Owner|SHA1"
          keytool -printcert -jarfile "$AAB" | grep -q "16:1E:F4:94:72:20:E1:76" || { echo "ASSINATURA ERRADA"; exit 1; }
          MF=$(find android/app/build/intermediates -name AndroidManifest.xml -path "*release*" | grep -i merged | head -1)
          echo "Manifesto: $MF"
          grep -oE 'android:name="android.permission.[A-Z_]+"|versionCode="[0-9]+"|versionName="[^"]+"|RecognitionService' "$MF" | sort -u
          grep -q RECORD_AUDIO "$MF" || { echo "SEM PERMISSAO DE MICROFONE"; exit 1; }
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
